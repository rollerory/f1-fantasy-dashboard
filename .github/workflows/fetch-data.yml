name: Fetch F1 Fantasy leaderboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch season leaderboard snapshot
        run: python3 scripts/fetch_leaderboard.py

      - name: Fetch per-Grand-Prix leaderboards
        run: python3 scripts/fetch_gp_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/gp_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update leaderboard snapshot"
            git push
          fi
